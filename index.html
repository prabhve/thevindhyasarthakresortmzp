    <script>
      // Gracefully handle harmless Vite dev WebSocket reconnection closures in iframe preview
      window.addEventListener('unhandledrejection', function (event) {
        if (
          event &&
          event.reason &&
          (event.reason.message?.includes('WebSocket') ||
           String(event.reason).includes('WebSocket') ||
           String(event.reason?.stack).includes('@vite/client'))
        ) {
          event.preventDefault();
        }
      });
    </script>
